<header class="cabecera">
    <h1 class="titulo">Lotería de Uniempresarial</h1>
    <p class="subtitulo">Sorteo de 5 balotas</p>
</header>

<main class="pagina">
    <section class="tablero">
        <p class="tablero__etiqueta">Resultado del sorteo</p>
        <div class="balotas">
            <app-balota [valor]="number1()" />
            <app-balota [valor]="number2()" />
            <app-balota [valor]="number3()" />
            <app-balota [valor]="number4()" />
            <app-balota [valor]="number5()" />
        </div>
    </section>

    <div class="acciones">
        <button (click)="playLotery()" class="button">JUGAR</button>
        <button (click)="buscarGanadores()" class="button button-secundario">VER GANADORES</button>
    </div>

    <hr class="separador" />

    <section class="resultado">
        <h2 class="resultado__numero">{{ numberWin() }}</h2>

        @if (totalGanadores() > 0) {
            <p class="resultado__detalle">Se encontraron {{ totalGanadores() }} jugador(es) ganador(es).</p>
        }
    </section>

    <section class="panel">
        <app-jugadores
            [numerosGanadores]="numerosSorteados()"
            (cantidadGanadores)="onCantidadGanadores($event)"
        />
    </section>
</main>
