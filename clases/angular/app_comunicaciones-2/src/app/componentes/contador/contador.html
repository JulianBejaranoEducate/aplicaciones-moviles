<main class="container py-4">
    <header class="text-center mb-4">
        <h1 class="h3">Comunicación entre componentes</h1>
        <p class="lead">Contador: <strong>{{ contador() }}</strong></p>
    </header>

    <section class="row g-3" aria-label="Controles del contador">
        <div class="col-md-6">
            <app-incrementar
                [valor]="contador()"
                (valorCambiado)="actulizarContador($event)"/>
        </div>

        <div class="col-md-6">
            <app-decrementar
                [valor]="contador()"
                (valorCambiado)="actulizarContador($event)"/>
        </div>
    </section>
</main>
