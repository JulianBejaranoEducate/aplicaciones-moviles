<router-outlet>
  <main>
    <header><h1>Notas</h1></header>
    <form class="card p-4 shadow-sm">
      <div class="mb-3">
        <label for="numero" class="form-label">Ingrese un número:</label>
        <input
          type="number"
          class="form-control"
          id="numero"
          name="numero"
          placeholder="Nota de 1 a 5"
          min="0"
          max="5"
          [value]="qualification"
          required
        />
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Calcular</button>
        <button type="reset" class="btn btn-secondary">Limpiar</button>
      </div>
    </form>
    <section>
      <p>Resultado</p>
      @if (qualification >= 0 && qualification <= 5) {
        @if (qualification >= 0 && qualification < 3) {
          <p>Nota Reprobrada</p>
        } @else {
          <p>Nota aprobrada</p>
        }
      } @else {
        <p>Nota fuera de rango</p>
      }
    </section>
  </main>
</router-outlet>
