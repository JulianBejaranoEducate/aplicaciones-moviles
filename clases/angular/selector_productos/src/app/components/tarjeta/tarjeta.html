<article class="card h-100 shadow-sm" [class.border-primary]="activo()" [class.border-2]="activo()">

  <header class="card-header d-flex justify-content-between align-items-center">
    <span class="badge text-bg-secondary">{{ producto().categoria }}</span>
    @if (activo()) {
      <span class="badge text-bg-primary">Seleccionado</span>
    }
  </header>

  <div class="card-body d-flex flex-column">
    <h3 class="card-title h6">{{ producto().nombre }}</h3>

    <p class="card-text small text-body-secondary flex-grow-1">
      {{ producto().descripcion }}
    </p>

    <p class="fs-5 fw-bold mb-3">$ {{ producto().precio | number: '1.0-0' }}</p>

    <button
      type="button"
      class="btn btn-primary w-100 mt-auto"
      [disabled]="activo()"
      (click)="seleccionar()">
      {{ activo() ? 'Producto seleccionado' : 'Seleccionar' }}
    </button>
  </div>

</article>
